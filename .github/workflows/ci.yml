name: CI

# Every push to main, every pull request and every manual run (Actions -> CI -> Run workflow):
# macOS universal build (arm64 + x86_64), unit tests (XCTest, parallel) and the release package.
# SDK: build-test and release run on the GitHub "xcode-27" image (macOS 27, Xcode 27, preview label) and select the
# newest installed Xcode (scripts/ci-xcode.sh), so the app links against the macOS 27 SDK – macOS 27 AppKit delivers
# direct touches to gesture recognizers only for apps built with that SDK (TN3212). Deployment target stays
# macOS 12 (Package.swift, LSMinimumSystemVersion 12.0); new APIs are used dynamically / behind availability checks.
# test-intel keeps the older macos-15-intel image (Xcode 16 / macOS 15 SDK) and so also proves older SDKs compile.
#   build-test   swift build (universal, release) + swift test --parallel on Apple silicon; SwiftPM build
#                cache via actions/cache; TouchBridge.app is packed into a DMG, mounted and verified
#                (bundle layout, Info.plist, code signature, CLI inside the bundle); uploaded as artefact.
#   test-intel   swift test on an Intel runner (x86_64 behaviour of the parser / gestures).
#   firmware     firmware/nrf-digitizer (Zephyr, nRF52840 digitizer dongle): host test of the protocol code, UF2
#                for s140v6-0x26000 / s140v7-0x27000 / nosd-0x1000; firmware-package bundles them as artefact
#                "touchbridge-digitizer-uf2" (BUILDINFO.txt, SHA256SUMS-firmware.txt).
#   release      on a published GitHub release: the DMG is built with the release tag as version
#                and attached together with the three dongle UF2 files and SHA256SUMS.txt (DMG + UF2).
# Signing: secrets TB_SIGN_P12 (base64 .p12) + TB_SIGN_P12_PASSWORD hold the self-signed certificate
# "TouchBridge Self-Signed (groovex)"; scripts/ci-keychain.sh imports it into a temporary keychain and
# package.sh signs with a fixed designated requirement (identifier + certificate leaf) so macOS keeps
# Input Monitoring / Accessibility across updates. Without the secrets (fork PRs) the app is signed ad-hoc.
# Pull requests that only change docs/** or *.md skip the builds; the "CI result" job reports for every run.
# On a failure the build/test log tail is written to the job summary and uploaded as artefact "ci-logs".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

# A new push to a pull request cancels its running CI; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------------- what to run
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.result.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
      - id: result
        env:
          EVENT: ${{ github.event_name }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then
            [ "$FILTER_CODE" = true ] || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changes: $code"

  docs-only:
    name: Docs only (builds skipped)
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Only docs/** or *.md changed - builds and tests are skipped."

  # ---------------------------------------------------------------------------------- macOS
  build-test:
    name: macOS universal build + tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (newest Xcode, macOS 27 SDK)
        run: |
          sw_vers
          scripts/ci-xcode.sh 27

      - name: SwiftPM build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-xcode27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: |
            spm-xcode27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-xcode27-${{ runner.os }}-${{ runner.arch }}-

      - name: Build (release, arm64 + x86_64)
        run: |
          set -o pipefail
          mkdir -p ci-logs
          swift build -c release --arch arm64 --arch x86_64 2>&1 | tee ci-logs/build.log

      - name: Tests
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee ci-logs/test.log

      - name: Smoke test (CLI starts, help + display list)
        run: |
          set -o pipefail
          bin="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path | tail -n 1)/TouchBridge"
          "$bin" --help | tee ci-logs/smoke.log
          "$bin" --list-displays | tee -a ci-logs/smoke.log

      - name: Signing identity (self-signed certificate from secrets; ad-hoc without)
        env:
          TB_SIGN_P12: ${{ secrets.TB_SIGN_P12 }}
          TB_SIGN_P12_PASSWORD: ${{ secrets.TB_SIGN_P12_PASSWORD }}
        run: scripts/ci-keychain.sh

      - name: Package (TouchBridge.app in DMG)
        run: |
          set -o pipefail
          scripts/package.sh "0.0.0-${GITHUB_SHA::7}" 2>&1 | tee ci-logs/package.log

      - name: Verify DMG
        run: |
          set -o pipefail
          dmg="$(ls dist/*.dmg)"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          app="$mnt/TouchBridge.app"
          {
            test -L "$mnt/Programme"
            test -f "$mnt/Zuerst lesen.txt"
            plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundleIdentifier|LSUIElement|CFBundleExecutable'
            # App-Icon + Menüleisten-Glyph im Bundle, CFBundleIconFile gesetzt, icns lesbar (alle Größen)
            test -s "$app/Contents/Resources/AppIcon.icns"
            test -s "$app/Contents/Resources/MenuBarIcon.png"
            test -s "$app/Contents/Resources/MenuBarIcon@2x.png"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")" = AppIcon
            iconset="$(mktemp -d)/AppIcon.iconset"
            iconutil -c iconset -o "$iconset" "$app/Contents/Resources/AppIcon.icns"
            ls "$iconset"
            for f in icon_16x16 icon_16x16@2x icon_32x32 icon_32x32@2x icon_128x128 icon_128x128@2x \
                     icon_256x256 icon_256x256@2x icon_512x512 icon_512x512@2x; do test -s "$iconset/$f.png"; done
            sips -g pixelWidth "$iconset/icon_512x512@2x.png" | grep -q 'pixelWidth: 1024'
            test -s "$mnt/.VolumeIcon.icns" && echo "Volume-Icon vorhanden"
            echo "App-Icon OK"
            lipo -info "$app/Contents/MacOS/TouchBridgeApp"
            archs="$(lipo -archs "$app/Contents/MacOS/TouchBridgeApp")"; case " $archs " in *" arm64 "*) ;; *) echo "missing arm64: $archs"; exit 1;; esac; case " $archs " in *" x86_64 "*) ;; *) echo "missing x86_64: $archs"; exit 1;; esac
            # Built with the macOS 27 SDK, deployment target still macOS 12
            test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 12.0
            plutil -p "$app/Contents/Info.plist" | grep -E 'DTSDKName|DTXcode|DTPlatformVersion|BuildMachineOSBuild'
            sdkname="$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$app/Contents/Info.plist")"
            sdkmajor="${sdkname#macosx}"; sdkmajor="${sdkmajor%%.*}"
            test "$sdkmajor" -ge 27 || { echo "::error::app built with $sdkname, expected macOS 27 SDK or newer"; exit 1; }
            for arch in arm64 x86_64; do
              bv="$(otool -arch "$arch" -l "$app/Contents/MacOS/TouchBridgeApp" | grep -A5 LC_BUILD_VERSION)"
              echo "$arch: $(echo "$bv" | awk '/minos|sdk/{printf "%s %s  ", $1, $2}')"
              echo "$bv" | awk '/ minos /{print $2}' | grep -qx '12.0' || { echo "::error::$arch minos is not 12.0"; exit 1; }
              s="$(echo "$bv" | awk '/ sdk /{print $2}')"; test "${s%%.*}" -ge 27 || { echo "::error::$arch linked against SDK $s"; exit 1; }
            done
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -d -r- "$app"
            help="$("$app/Contents/MacOS/touchbridge" --help)"; echo "${help%%$'\n'*}"
            # Menüleisten-App startet und läuft stabil (4 s), dann beenden
            "$app/Contents/MacOS/TouchBridgeApp" & pid=$!
            sleep 4
            kill -0 "$pid" && echo "TouchBridgeApp läuft (pid $pid)"
            kill "$pid"; wait "$pid" 2>/dev/null || true
          } 2>&1 | tee ci-logs/verify.log
          hdiutil detach "$mnt" || hdiutil detach -force "$mnt"

      - uses: actions/upload-artifact@v4
        with:
          name: TouchBridge-macOS-universal
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt

      - name: Remove signing keychain
        if: always()
        run: '[ -n "${TB_SIGN_KEYCHAIN:-}" ] && security delete-keychain "$TB_SIGN_KEYCHAIN" || true'

      - name: Failure report
        if: failure()
        run: |
          {
            echo "## Build/test log (tail)"
            for f in ci-logs/*.log; do
              [ -f "$f" ] || continue
              echo "### $f"; echo '```'; grep -E "error:|warning:|failed|XCTAssert" "$f" | head -60; echo '...'; tail -n 80 "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-logs
          path: ci-logs
          if-no-files-found: ignore

  test-intel:
    name: Tests (Intel x86_64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (image default, older SDK)
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-${{ runner.os }}-${{ runner.arch }}-
      - name: Tests
        run: swift test --parallel

  # ---------------------------------------------------------------------------------- nRF52840 dongle firmware
  # firmware/nrf-digitizer (Zephyr): UF2 for the three bootloader layouts of the Pro Micro nRF52840 /
  # nice!nano v2 (same approach as the Auracaster dongle), plus a native host test of the protocol code.
  firmware:
    name: Firmware UF2 ${{ matrix.variant }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WS: ${{ github.workspace }}/../zws
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    strategy:
      fail-fast: false
      matrix:
        include:
          # S140 v6.1.1 (original nice!nano bootloader): app at 0x26000
          - { variant: s140v6-0x26000, board: promicro_nrf52840/nrf52840/uf2, overlay: '',             start: '0x26000' }
          # S140 v7.x bootloaders: app at 0x27000
          - { variant: s140v7-0x27000, board: promicro_nrf52840/nrf52840/uf2, overlay: 'sdv7.overlay', start: '0x27000' }
          # bootloader without SoftDevice ("SoftDevice: not found"): app at 0x1000
          - { variant: nosd-0x1000,    board: promicro_nrf52840/nrf52840,     overlay: '',             start: '0x1000' }
    steps:
      - uses: actions/checkout@v4

      - name: Host test (protocol parser + HID report builder)
        working-directory: firmware/nrf-digitizer/tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I../src ../src/tb_proto.c ../src/tb_report.c proto_test.c -o proto_test
          ./proto_test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache west modules (zephyr, hal_nordic, cmsis)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WS }}/zephyr
            ${{ env.WS }}/modules
            ${{ env.WS }}/.west
          key: west-digitizer-${{ hashFiles('firmware/nrf-digitizer/west.yml') }}

      - name: Prepare west workspace
        run: |
          set -euo pipefail
          mkdir -p "$WS"
          rm -rf "$WS/nrf-digitizer" && cp -r firmware/nrf-digitizer "$WS/nrf-digitizer"
          pip install --quiet west
          cd "$WS"
          [ -d .west ] || west init -l nrf-digitizer
          west update --narrow -o=--depth=1
          pip install --quiet -r zephyr/scripts/requirements-base.txt
          echo "SDK_VERSION=$(cat zephyr/SDK_VERSION)" >> "$GITHUB_ENV"

      - name: Cache Zephyr SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/zephyr-sdk-${{ env.SDK_VERSION }}
          key: zephyr-sdk-${{ env.SDK_VERSION }}-linux-x86_64-arm

      - name: Install Zephyr SDK (minimal + arm-zephyr-eabi)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VERSION}"
          cd ~
          curl -fsSL "$base/zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz" | tar xJ
          mkdir -p "zephyr-sdk-${SDK_VERSION}/gnu"
          curl -fsSL "$base/toolchain_gnu_linux-x86_64_arm-zephyr-eabi.tar.xz" | tar xJ -C "zephyr-sdk-${SDK_VERSION}/gnu"

      - name: Build
        run: |
          set -euo pipefail
          export ZEPHYR_SDK_INSTALL_DIR="$HOME/zephyr-sdk-${SDK_VERSION}"
          cd "$WS"
          extra=""
          [ -n "${{ matrix.overlay }}" ] && extra="-DEXTRA_DTC_OVERLAY_FILE=$WS/nrf-digitizer/${{ matrix.overlay }}"
          set +e
          west build -p always -b ${{ matrix.board }} -d build/out nrf-digitizer -- $extra > build.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            { grep -E "(error|Error|ERROR)[: ]" build.log | grep -v "^--" | head -n 20 | while read -r l; do echo "::error title=firmware ${{ matrix.variant }}::$l"; done; } || true
            tail -n 60 build.log
            exit $rc
          fi
          grep -E "warning:" build.log | grep -v "^--" | head -n 20 || true
          tail -n 12 build.log

      - name: Check and collect
        run: |
          set -euo pipefail
          cd "$WS"
          chk=nrf-digitizer/scripts/uf2info.py
          dist="${GITHUB_WORKSPACE}/dist"; mkdir -p "$dist"
          name="touchbridge-digitizer-${{ matrix.variant }}"
          python3 $chk build/out/zephyr/zephyr.uf2 --expect-start ${{ matrix.start }}
          cp build/out/zephyr/zephyr.uf2 "$dist/$name.uf2"
          {
            echo "== ${{ matrix.variant }} =="
            python3 $chk "$dist/$name.uf2"
            grep -E '^CONFIG_(USB_DEVICE_STACK_NEXT|USBD_HID_SUPPORT|USBD_CDC_ACM_CLASS|FLASH_LOAD_OFFSET)=' build/out/zephyr/.config || true
            echo "zephyr: $(cd zephyr && grep -E '^(VERSION_MAJOR|VERSION_MINOR|PATCHLEVEL)' VERSION | awk '{print $3}' | paste -sd. -) sdk: ${SDK_VERSION}"
          } > "$dist/info-${{ matrix.variant }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: uf2-${{ matrix.variant }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  firmware-package:
    name: Package touchbridge-digitizer-uf2
    needs: firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: firmware
      - uses: actions/download-artifact@v4
        with:
          pattern: uf2-*
          merge-multiple: true
          path: dist
      - name: BUILDINFO + checksums
        run: |
          set -euo pipefail
          cd dist
          ver="$(awk -F' = ' '/^VERSION_MAJOR/{a=$2}/^VERSION_MINOR/{b=$2}/^PATCHLEVEL/{c=$2}END{print a"."b"."c}' ../firmware/nrf-digitizer/VERSION)"
          {
            echo "TouchBridge Digitizer firmware ${ver}"
            echo "commit:  ${GITHUB_SHA}"
            echo "board:   promicro_nrf52840 (Pro Micro nRF52840 / nice!nano v2 compatible)"
            echo "USB:     2fe3:0010 \"TouchBridge Digitizer\" (CDC ACM + HID touch screen)"
            echo
            echo "Which file? Open INFO_UF2.TXT on the bootloader drive (double reset):"
            echo "  SoftDevice: S140 version 6.x.x -> touchbridge-digitizer-s140v6-0x26000.uf2"
            echo "  SoftDevice: S140 version 7.x.x -> touchbridge-digitizer-s140v7-0x27000.uf2"
            echo "  SoftDevice: not found          -> touchbridge-digitizer-nosd-0x1000.uf2"
            echo
            cat info-*.txt
          } > BUILDINFO.txt
          rm info-*.txt
          test "$(ls touchbridge-digitizer-*.uf2 | wc -l)" -eq 3
          sha256sum touchbridge-digitizer-*.uf2 > SHA256SUMS-firmware.txt
          cat BUILDINFO.txt SHA256SUMS-firmware.txt; ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: touchbridge-digitizer-uf2
          path: dist/
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------------- release
  release:
    name: Attach release package
    needs: [build-test, test-intel, firmware-package]
    if: github.event_name == 'release'
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (newest Xcode, macOS 27 SDK)
        run: scripts/ci-xcode.sh 27
      - name: Signing identity (self-signed certificate from secrets)
        env:
          TB_SIGN_P12: ${{ secrets.TB_SIGN_P12 }}
          TB_SIGN_P12_PASSWORD: ${{ secrets.TB_SIGN_P12_PASSWORD }}
        run: scripts/ci-keychain.sh
      - name: Build package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: Remove signing keychain
        if: always()
        run: '[ -n "${TB_SIGN_KEYCHAIN:-}" ] && security delete-keychain "$TB_SIGN_KEYCHAIN" || true'
      - uses: actions/download-artifact@v4
        with:
          name: touchbridge-digitizer-uf2
          path: dist-fw
      - name: Add dongle firmware (UF2) to the package and SHA256SUMS.txt
        run: |
          set -euo pipefail
          cp dist-fw/touchbridge-digitizer-*.uf2 dist/
          cp dist-fw/BUILDINFO.txt dist/touchbridge-digitizer-BUILDINFO.txt
          (cd dist && shasum -a 256 touchbridge-digitizer-*.uf2 >> SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/touchbridge-digitizer-*.uf2 dist/touchbridge-digitizer-BUILDINFO.txt dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

  # ---------------------------------------------------------------------------------- gate
  result:
    name: CI result
    if: always()
    needs: [changes, docs-only, build-test, test-intel, firmware, firmware-package, release]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, os, sys
          needs = json.load(sys.stdin)
          code = os.environ["CODE"] == "true"
          bad = []
          for name, n in needs.items():
              r = n["result"]
              print(f"{name:12} {r}")
              if r in ("failure", "cancelled"):
                  bad.append(name)
              if code and r == "skipped" and name not in ("docs-only", "release"):
                  bad.append(name)
          if needs["changes"]["result"] != "success":
              bad.append("changes")
          sys.exit(f"failed: {bad}" if bad else 0)'
