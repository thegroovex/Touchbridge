# TouchBridge Digitizer - USB composite device (CDC ACM + HID touch screen)

# --- System -------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_HWINFO=y
CONFIG_RING_BUFFER=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
# no console / logging: the CDC ACM port carries the TouchBridge protocol
CONFIG_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# DTR (host opened the port) and baud rate (1200 baud touch -> UF2 bootloader)
CONFIG_UART_LINE_CTRL=y

# --- USB device stack (device_next) ------------------------------------------
# The board's own CDC ACM boot initialisation is replaced by src/main.c, which
# registers CDC ACM and HID in one configuration (VID/PID 2fe3:0010).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_HID_SUPPORT=y
# 1 report in flight + 1 spare
CONFIG_USBD_HID_IN_BUF_COUNT=2
